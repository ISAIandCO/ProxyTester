[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proxytester"
dynamic = ["version"]
description = "Isolated VLESS/Hysteria2 and VPN to WARP service tester"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "cryptography==50.0.0", "PyYAML==6.0.3", "playwright==1.62.0"]

[project.scripts]
proxytester = "proxytester.cli:main"

[project.gui-scripts]
proxytester-gui = "proxytester.gui:launch"

[tool.setuptools.package-data]
proxytester = ["report.html", "cores.lock.json"]

[tool.setuptools.dynamic]
version = {attr = "proxytester.__version__"}
