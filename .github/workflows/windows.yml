name: Test and build Windows portable
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested version to GitHub Releases'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['proxytester/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/windows.yml', 'Start.cmd']
  pull_request:
    paths: ['proxytester/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/windows.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONUNBUFFERED: '1'
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and pinned cores
        run: |
          python -m pip install . pyinstaller==6.17.0
          python -m proxytester setup
      - name: Prepare pinned Brave for manual login QA
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/brave.zip"
          Invoke-WebRequest 'https://github.com/brave/brave-browser/releases/download/v1.99.57/brave-v1.99.57-win32-x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '42ba3a5445f717b429fb3fe457e7e531cd1c208f06a2dc9315b1fa31c09bc8b9') { throw 'Brave SHA256 mismatch' }
          Expand-Archive $archive "$env:RUNNER_TEMP/brave-qa"
          $browser = (Get-ChildItem "$env:RUNNER_TEMP/brave-qa" -Filter brave.exe -Recurse | Select-Object -First 1).FullName
          if (!$browser) { throw 'Brave executable missing' }
          "PROXYTESTER_LOGIN_BROWSER_TEST=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Get-Item $browser).VersionInfo | Select-Object ProductName, ProductVersion
      - name: Unit, real transport and Chromium tests
        env:
          PROXYTESTER_BROWSER_TESTS: '1'
          PROXYTESTER_LIVE_SMOKE: '1'
          PROXYTESTER_TEST_LOGS: '1'
          PROXYTESTER_GUI_QA: '1'
        run: python -m unittest discover -s tests -v
      - name: Build self-contained portable ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GUI-QA
          path: data/gui-qa/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTester-windows-x64
          path: |
            dist/ProxyTester-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: windows
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
       (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ProxyTester-windows-x64
          path: release-assets
      - name: Publish tested portable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          version=$(python -c "import runpy; print(runpy.run_path('proxytester/__init__.py')['__version__'])")
          tag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == push && "$(head -n 1 <<< "$RELEASE_REQUEST")" != "Release $tag" ]]; then
            echo 'Release commit title must match the application version.'
            exit 1
          fi
          if gh release view "$tag" --json isDraft,targetCommitish > release.json 2>/dev/null; then
            python -c "import json,os; r=json.load(open('release.json')); assert r['isDraft'] and r['targetCommitish']==os.environ['GITHUB_SHA'], 'Refusing to replace an existing release'"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "ProxyTester $version" --notes-file docs/RELEASE_NOTES.md --draft
          fi
          gh release upload "$tag" release-assets/ProxyTester-windows-x64.zip release-assets/SHA256SUMS.txt --clobber
          gh release edit "$tag" --notes-file docs/RELEASE_NOTES.md --draft=false --latest
