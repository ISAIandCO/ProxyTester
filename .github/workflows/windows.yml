name: Test and build Windows portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['proxytester/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/windows.yml', 'Start.cmd']
  pull_request:
    paths: ['proxytester/**', 'tests/**', 'scripts/**', 'pyproject.toml', '.github/workflows/windows.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and pinned cores
        run: |
          python -m pip install . pyinstaller==6.17.0
          python -m proxytester setup
      - name: Unit, real transport and Chromium tests
        env:
          PROXYTESTER_BROWSER_TESTS: '1'
          PROXYTESTER_TEST_LOGS: '1'
        run: python -m unittest discover -s tests -v
      - name: Build self-contained portable ZIP
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyTester-windows-x64
          path: |
            dist/ProxyTester-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
